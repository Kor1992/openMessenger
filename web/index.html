<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripple Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">↗</div>
        <h1>Ripple</h1>
        <p>Открытый мессенджер</p>
      </div>
      <form id="auth-form" class="auth-form">
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-tab="login">Вход</button>
          <button type="button" class="auth-tab" data-tab="register">Регистрация</button>
        </div>
        <div id="auth-error" class="auth-error" style="display:none"></div>
        <div class="auth-fields">
          <input id="auth-username" type="text" placeholder="Имя пользователя" autocomplete="username" required>
          <input id="auth-password" type="password" placeholder="Пароль" autocomplete="current-password" required>
        </div>
        <button type="submit" class="auth-submit" id="auth-submit-btn">Войти</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="app" style="display:none">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">↗</div>
          <span class="logo-text">Ripple</span>
        </div>
        <button class="icon-btn" id="btn-new-chat" title="Новый чат">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="sidebar-user" id="sidebar-user">
        <div class="avatar avatar-sm" id="my-avatar"></div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name" id="my-username"></span>
          <span class="sidebar-user-status">в сети</span>
        </div>
        <button class="icon-btn" id="btn-logout" title="Выйти">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>

      <div class="sidebar-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="chat-search" type="text" placeholder="Поиск">
      </div>

      <div class="chat-list" id="chat-list"></div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main" id="main">

      <!-- EMPTY STATE -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">💬</div>
        <h2>Выберите чат</h2>
        <p>или начните новый разговор</p>
      </div>

      <!-- CHAT VIEW -->
      <div class="chat-view" id="chat-view" style="display:none">
        <div class="chat-header" id="chat-header">
          <button class="icon-btn mobile-back" id="btn-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <div class="chat-header-avatar" id="chat-avatar"></div>
          <div class="chat-header-info">
            <h2 id="chat-name">Чат</h2>
            <span id="chat-members-count"></span>
          </div>
          <div class="chat-header-actions">
            <button class="icon-btn" id="btn-add-member" title="Добавить участника">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
            </button>
          </div>
        </div>

        <div class="messages" id="messages"></div>

        <form class="composer" id="composer">
          <textarea id="msg-input" rows="1" placeholder="Написать сообщение..."></textarea>
          <button type="submit" class="send-btn" id="send-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- NEW CHAT MODAL -->
  <div class="modal-overlay" id="modal-new-chat" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>Новый чат</h3>
        <button class="icon-btn modal-close" data-close="modal-new-chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="user-search" type="text" placeholder="Найти пользователя по имени...">
        </div>
        <div class="user-list" id="user-search-results"></div>
      </div>
    </div>
  </div>

  <!-- ADD MEMBER MODAL -->
  <div class="modal-overlay" id="modal-add-member" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>Добавить участника</h3>
        <button class="icon-btn modal-close" data-close="modal-add-member">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="member-search" type="text" placeholder="Найти пользователя по имени...">
        </div>
        <div class="user-list" id="member-search-results"></div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
